name: Basic AI validation

on:
  pull_request:
  push:
    branches:
      - feature/basic-v5-keyboard-markdown

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, bundle and regression checks
        run: npm run check
