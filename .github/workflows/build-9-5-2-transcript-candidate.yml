name: Build 9.5.2 voice transcript candidate
on:
  push:
    branches: [feat/9.5.2-fake-audio-transcription]
permissions:
  contents: write
concurrency:
  group: candidate-9-5-2-transcript
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build final plugin bundle and stylesheet
        run: npm run build
      - name: Run syntax and full regression suite
        run: npm run check
      - name: Validate CSS for Obsidian community
        run: node --test tests/css-community-lint.test.cjs
      - name: Save generated distributables on candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js styles.css
          if git diff --cached --quiet; then
            echo "Plugin bundles were already synchronized"
          else
            git commit -m "build: sync 9.5.2 transcript plugin assets [bundle-sync]"
            git push origin HEAD:feat/9.5.2-fake-audio-transcription
          fi
