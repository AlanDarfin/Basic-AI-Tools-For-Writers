name: Build and verify 9.5.1 chat assets
on:
  push:
    branches: [fix/9.5.1-chat-separators-group-photo]
permissions:
  contents: write
concurrency:
  group: chat-9-5-1-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate the packaged Obsidian files
        run: npm run build
      - name: Full syntax, bundle, and regression suite
        run: npm run check
      - name: Community stylesheet tests
        run: node --test tests/css-community-lint.test.cjs
      - name: Commit only built main.js and styles.css on candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js styles.css
          if git diff --cached --quiet; then
            echo "Shipped assets already synchronized"
          else
            git commit -m "build: sync 9.5.1 chat plugin assets [bundle-sync]"
            git push origin HEAD:fix/9.5.1-chat-separators-group-photo
          fi
