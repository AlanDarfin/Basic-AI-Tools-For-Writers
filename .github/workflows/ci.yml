name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full syntax, bundle sync and regression checks
        run: npm run check
      - name: Community CSS lint
        run: node --test tests/css-community-lint.test.cjs
      - name: Metadata and bilingual documentation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),lock=require('./package-lock.json'),v=require('./versions.json');
          if(!/^\d+\.\d+\.\d+(?:-(?:beta|rc)\.\d+)?$/.test(m.version))throw Error('Invalid version');
          if(p.version!==m.version||lock.version!==m.version||lock.packages[''].version!==m.version||v[m.version]!==m.minAppVersion)throw Error('Version mismatch');
          if(m.id!=='basic-ai-tool-for-writers'||m.isDesktopOnly!==false)throw Error('Unexpected plugin identity');
          if(!m.name.trim()||/\b(obsidian|plugin)\b/i.test(m.name))throw Error('Redundant name');
          if(typeof m.description!=='string'||m.description.length>250||!m.description.endsWith('.'))throw Error('Invalid description');
          for(const file of ['README.md','docs/README.pt-BR.md']) {
            if(!fs.readFileSync(file,'utf8').includes(m.version))throw Error('Version missing from '+file);
          }
          for(const file of ['main.js','styles.css','THIRD_PARTY_NOTICES.md','CONTRIBUTING.md','SECURITY.md']) {
            if(!fs.statSync(file).size)throw Error('Missing '+file);
          }
          NODE
      - name: Package three-file smoke test
        shell: bash
        run: |
          set -euo pipefail
          zip -j plugin-check.zip main.js manifest.json styles.css
          unzip -t plugin-check.zip
          test "$(unzip -Z1 plugin-check.zip | wc -l)" -eq 3
