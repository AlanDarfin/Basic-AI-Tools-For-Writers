name: Publish Basic AI writing projects beta.3
on:
  push:
    paths:
      - '.github/workflows/publish-beta3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify plugin and test compatibility
        run: |
          node --check main.js
          node --check projects.js
          node scripts/sync-projects.js --check
          node tests/projects.test.js
          node -e "const m=require('./manifest.json');if(m.version!=='2.0.0-beta.3'||m.id!=='basic-ai-tool-for-writers')process.exit(1)"
      - name: Package plugin
        run: zip -j basic-ai-tool-for-writers-2.0.0-beta.3.zip main.js manifest.json styles.css
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 2.0.0-beta.3 >/dev/null 2>&1; then
            echo "Already published"; exit 0
          fi
          gh release create 2.0.0-beta.3 main.js manifest.json styles.css basic-ai-tool-for-writers-2.0.0-beta.3.zip \
            --target "$GITHUB_SHA" --title "Basic AI Tool for Writers 2.0.0-beta.3" \
            --prerelease --notes "Longform-compatible project workspace beta, native nested scene YAML, drafts, workflow editor/import, project notes, writing sessions and index backups. Test before replacing Longform."
