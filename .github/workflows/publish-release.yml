name: Publish versioned stable release
# Stable public versions publish after a version bump is merged into main.
# Main and the matching tag share a concurrency group to prevent race conditions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [manifest.json]
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '!*-*'
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: basic-stable-publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    name: Validate, attest and publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve version and skip already published releases
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a stable version"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag does not match manifest"; exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          # A previous API 5xx can leave a draft or asset-less release.
          # Only skip a fully published release containing every install file.
          complete="$(gh release view "$version" --json isDraft,assets --jq '(.isDraft|not) and ([.assets[].name] | (index("main.js") != null) and (index("manifest.json") != null) and (index("styles.css") != null))' 2>/dev/null || true)"
          if [[ "$complete" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version already published with three Obsidian install files; preserving assets."
          fi
      - name: Validate manifest, package, lockfile and docs
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),tag=process.env.RELEASE_TAG;
          const m=require('./manifest.json'),p=require('./package.json'),l=require('./package-lock.json'),v=require('./versions.json');
          if(m.version!==tag||p.version!==tag||l.version!==tag||v[tag]!==m.minAppVersion)throw Error('Tag/manifest/lock mismatch');
          if(m.id!=='basic-ai-tool-for-writers'||/\b(obsidian|plugin)\b/i.test(m.name)||m.isDesktopOnly!==false)throw Error('Manifest policy violation');
          for(const file of ['README.md','docs/README.pt-BR.md']) {
            if(!fs.readFileSync(file,'utf8').includes(tag))throw Error('Missing documentation: '+file);
          }
          NODE
      - name: Full suite and CSS compatibility
        if: steps.version.outputs.skip != 'true'
        run: |
          npm run build
          npm run check
          node --test tests/css-community-lint.test.cjs
      - name: Create offline archive and checksums
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          zip -j "Basic-AI-Tool-for-Writers-${RELEASE_TAG}.zip" main.js manifest.json styles.css
          unzip -t "Basic-AI-Tool-for-Writers-${RELEASE_TAG}.zip"
          test "$(unzip -Z1 "Basic-AI-Tool-for-Writers-${RELEASE_TAG}.zip" | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css "Basic-AI-Tool-for-Writers-${RELEASE_TAG}.zip" > "SHA256SUMS-${RELEASE_TAG}.txt"
      - name: Attest provenance
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            Basic-AI-Tool-for-Writers-${{ steps.version.outputs.tag }}.zip
      - name: Upload ZIP and checksums as workflow artifacts
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: offline-install-${{ steps.version.outputs.tag }}
          path: |
            Basic-AI-Tool-for-Writers-${{ steps.version.outputs.tag }}.zip
            SHA256SUMS-${{ steps.version.outputs.tag }}.txt
          if-no-files-found: error
      - name: Create stable Git tag if needed (after validation)
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha" 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              # Recovery commits may change workflows/tests but never retag.
              # Proceed only if the validated distributable bytes match the tag.
              for file in main.js manifest.json styles.css; do
                tagged="$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$RELEASE_TAG" --jq .sha)"
                current="$(git hash-object "$file")"
                [[ "$tagged" == "$current" ]] || { echo "Existing tag differs in $file; refusing to publish"; exit 1; }
              done
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Publish only supported plugin release files
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "13.1.0" ]]; then
            notes=(--notes-file docs/RELEASE_V13_1.md)
          elif [[ "$RELEASE_TAG" == "13.0.2" ]]; then
            notes=(--notes-file docs/RELEASE_V13_0_2.md)
          elif [[ "$RELEASE_TAG" == "13.0.0" ]]; then
            notes=(--notes-file docs/RELEASE_V13.md)
          else
            notes=(--generate-notes)
          fi
          # Retry transient GitHub API errors, including a failed creation that
          # left an unpublished draft or a release missing its install files.
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber \
                && gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest; then
                echo "Release repaired/published with the three supported Obsidian install files."
                exit 0
              fi
            elif gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
              --verify-tag --title "Basic AI Tool for Writers $RELEASE_TAG" \
              --latest "${notes[@]}"; then
              echo "Release published."
              exit 0
            fi
            sleep "$((attempt*3))"
          done
          echo "Could not publish or repair release after retries." >&2
          exit 1
