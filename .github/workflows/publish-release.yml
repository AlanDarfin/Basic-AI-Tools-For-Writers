name: Publish versioned stable release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '!*-*'
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Validate, attest and publish the community package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked toolchain
        run: npm ci --ignore-scripts
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),tag=process.env.GITHUB_REF_NAME;
          const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json'),l=require('./package-lock.json');
          if(!/^\d+\.\d+\.\d+$/.test(tag)||m.version!==tag||p.version!==tag||v[tag]!==m.minAppVersion||l.version!==tag)throw Error('Tag/manifest/lockfile mismatch');
          if(m.id!=='basic-ai-tool-for-writers'||/\b(obsidian|plugin)\b/i.test(m.name)||m.isDesktopOnly!==false)throw Error('Manifest policy violation');
          for(const file of ['README.md','docs/README.pt-BR.md']){
            if(!fs.readFileSync(file,'utf8').includes(tag))throw Error('Missing documentation: '+file);
          }
          NODE
      - name: Run all checks
        run: |
          npm run check
          node --test tests/css-community-lint.test.cjs tests/community-release.test.cjs
      - name: Check that generated code is unchanged
        run: git diff --exit-code -- main.js projects.js
      - name: Verify three-file package
        run: node scripts/check-community-package.cjs
      - name: Attest the three official release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release (three supported assets only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; no assets changed."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag --title "Basic AI Tool for Writers $GITHUB_REF_NAME" \
            --latest --generate-notes
