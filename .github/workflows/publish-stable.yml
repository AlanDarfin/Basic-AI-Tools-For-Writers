name: Publish stable release 1.5.1
on:
  push:
    paths:
      - '.github/workflows/publish-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin package
        shell: bash
        run: |
          set -euo pipefail
          node --check main.js
          node -e "const m=require('./manifest.json'); if(m.version!=='1.5.1'||m.name!=='Basic AI Tool for Writers'||m.id!=='basic-ai-tool-for-writers')process.exit(1)"
          test -s styles.css
          test -s README.md
      - name: Package plugin
        run: zip -j basic-ai-tool-for-writers-1.5.1.zip main.js manifest.json styles.css
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.5.1 >/dev/null 2>&1; then
            echo 'Release already exists; skipping.'
            exit 0
          fi
          gh release create 1.5.1 main.js manifest.json styles.css basic-ai-tool-for-writers-1.5.1.zip \
            --target "$GITHUB_SHA" \
            --title "Basic AI Tool for Writers 1.5.1" \
            --latest \
            --notes "Sidebar chat redesign. AI definitions, synonyms and antonyms, independent translation engine, source/target language selectors, editable prompts, context-menu writing tools and model management. Non-destructive LanguageTool grammar review, AI style review and beta-reader modes, and editable review settings."
