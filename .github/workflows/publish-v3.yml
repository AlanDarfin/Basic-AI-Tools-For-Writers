name: Publish v3 stable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.yml'
      - 'manifest.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check v3
        run: npm run check
      - name: Validate stable version
        run: node -e "const m=require('./manifest.json');if(m.version!=='3.0.0')process.exit(1)"
      - name: Build and fingerprint
        run: |
          version=$(node -p "require('./manifest.json').version")
          zip -j "basic-ai-tool-for-writers-${version}.zip" main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css "basic-ai-tool-for-writers-${version}.zip" > SHA256SUMS.txt
      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$version" main.js manifest.json styles.css "basic-ai-tool-for-writers-${version}.zip" SHA256SUMS.txt THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" --latest --title "Basic AI Tool for Writers $version" \
            --notes "Stable v3.0.0: responsive desktop sidebar, original Template by Note Name matching rules, Longform tasks, Unicode, TTS, review, dictionary and AI writing tools. Includes migration backup. See docs/WRITING_SUITE.md."
