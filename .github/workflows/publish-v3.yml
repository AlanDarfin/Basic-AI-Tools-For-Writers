name: Publish v3 releases
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.yml'
      - 'manifest.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check v3
        run: npm run check
      - name: Validate version
        run: node -e "const m=require('./manifest.json');if(!/^3\.\d+\.\d+(-beta\.\d+)?$/.test(m.version))process.exit(1)"
      - name: Build and fingerprint
        run: |
          version=$(node -p "require('./manifest.json').version")
          zip -j "basic-ai-tool-for-writers-${version}.zip" main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css "basic-ai-tool-for-writers-${version}.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          flags=(--target "$GITHUB_SHA" --title "Basic AI Tool for Writers $version")
          if [[ "$version" == *-beta.* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$version" main.js manifest.json styles.css "basic-ai-tool-for-writers-${version}.zip" SHA256SUMS.txt THIRD_PARTY_NOTICES.md "${flags[@]}" \
            --notes "Version $version: improved Unicode picker, horizontal tabs and optional Microsoft Edge online TTS alongside system speech. Online speech requires explicit opt-in and may become unavailable. See docs/WRITING_SUITE.md."
