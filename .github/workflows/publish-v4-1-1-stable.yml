# Retry after aligning the localization metadata regression with version 4.1.1.
# Trigger after updating tests for the newly valid CSS selectors.
# Re-trigger after synchronizing the v3 workspace source with main.js.
name: Publish Basic AI 4.1.1 (Obsidian compatible)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4-1-1-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax and regression tests
        run: npm run check
      - name: Verify Obsidian CSS lint fixes
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');if(m.version!=='4.1.1'||p.version!==m.version||v[m.version]!==m.minAppVersion)process.exit(1)"
          test -s main.js
          test -s manifest.json
          test -s styles.css
      - name: Build archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-4.1.1.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-4.1.1.zip
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-4.1.1.zip > SHA256SUMS-4.1.1.txt
      - name: Create unprefixed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 4.1.1 >/dev/null 2>&1; then
            echo 'Release 4.1.1 already exists; refusing to overwrite'
            exit 1
          fi
          gh release create 4.1.1 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-4.1.1.zip SHA256SUMS-4.1.1.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 4.1.1' \
            --latest \
            --notes-file docs/V4_1_1_RELEASE.md
