name: Publish Basic AI v4.1.0 stable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4-1-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source synchronization, localization and regression tests
        run: npm run check
      - name: Validate stable manifest and translation coverage
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const manifest=require('./manifest.json');
          const pkg=require('./package.json');
          const versions=require('./versions.json');
          if(manifest.id!=='basic-ai-tool-for-writers')throw Error('Invalid plugin ID');
          if(manifest.version!=='4.1.0'||pkg.version!=='4.1.0'||versions['4.1.0']!==manifest.minAppVersion)throw Error('Invalid release metadata');
          if(manifest.isDesktopOnly!==false)throw Error('Mobile support disabled');
          for(const file of ['main.js','manifest.json','styles.css','README.md','docs/README.pt-BR.md','docs/V4_1_RELEASE.md','THIRD_PARTY_NOTICES.md']){
            if(!fs.existsSync(file)||!fs.statSync(file).size)throw Error('Missing release file '+file);
          }
          const code=fs.readFileSync('main.js','utf8');
          for(const marker of [
           "lfMsg('Novo subcapítulo','New subchapter')",
           "lfMsg('Padrão','Default')",
           "writerUi('Restaurar','Restore')",
           "writerUi('Ativar histórico local','Enable local history')",
           'writerMergeModules(this.settings)',
           'writerAutoGrammarWindow',
           'v4-format-'
          ])if(!code.includes(marker))throw Error('Missing localized capability: '+marker);
          NODE
      - name: Build ZIP and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-v4.1.0.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-v4.1.0.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-v4.1.0.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-v4.1.0.zip > SHA256SUMS-v4.1.0.txt
      - name: Publish stable release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.1.0 >/dev/null 2>&1; then
            echo 'Release v4.1.0 already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v4.1.0 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-v4.1.0.zip SHA256SUMS-v4.1.0.txt \
            THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers v4.1.0' \
            --latest \
            --notes-file docs/V4_1_RELEASE.md
