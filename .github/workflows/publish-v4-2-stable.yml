# Recheck stable workflow after fixing generic CSS-release version test.
name: Publish Basic AI Tool for Writers 4.2.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4-2-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bundled sources, syntax and full regression suite
        run: npm run check
      - name: Validate community CSS rules
        run: node --test tests/css-community-lint.test.cjs
      - name: Verify 4.2.0 manifest and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='4.2.0'||p.version!==m.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly)throw Error('Incorrect 4.2.0 metadata');
          for(const name of ['main.js','manifest.json','styles.css','src/v4/cursor-memory.js','docs/V4_2_RELEASE.md']){
            if(!fs.statSync(name).size)throw Error('Missing file '+name);
          }
          NODE
      - name: Archive and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-4.2.0.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-4.2.0.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-4.2.0.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-4.2.0.zip > SHA256SUMS-4.2.0.txt
      - name: Publish version tag without v prefix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 4.2.0 >/dev/null 2>&1; then
            echo 'Release 4.2.0 exists; not overwriting.'
            exit 1
          fi
          gh release create 4.2.0 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-4.2.0.zip SHA256SUMS-4.2.0.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 4.2.0' \
            --latest \
            --notes-file docs/V4_2_RELEASE.md
