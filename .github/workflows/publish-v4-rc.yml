name: Publish Basic AI v4 RC1
on:
  push:
    branches: [feat/v4-rc1-optional-modules]
    paths:
      - '.github/workflows/publish-v4-rc.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality-and-prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete suite
        run: npm run check
      - name: Validate candidate metadata and module isolation
        run: |
          node - <<'NODE'
          const fs=require('fs'),m=require('./manifest.json'),p=require('./package.json');
          if(m.version!=='4.0.0-rc.1'||p.version!==m.version||m.id!=='basic-ai-tool-for-writers'||m.isDesktopOnly!==false)process.exit(1);
          const content=fs.readFileSync('main.js','utf8');
          for(const name of ['writerMergeModules(this.settings)','writerRenderModuleSettings(this.plugin,panel',
             'writerRenderDiagnostics(this.plugin,panel','writerModuleOn(this,','writerAutoGrammarWindow','writer-project-scene-depth-mark']){
            if(!content.includes(name))throw Error('RC missing required feature: '+name);
          }
          NODE
      - name: Package installable release candidate and SHA256
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-v4.0.0-rc.1.zip main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-v4.0.0-rc.1.zip > SHA256SUMS-v4-rc1.txt
      - name: Publish RC1 as prerelease (never stable/latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.0.0-rc.1 >/dev/null 2>&1; then
            echo 'RC1 already exists; no overwrite'
            exit 0
          fi
          gh release create v4.0.0-rc.1 main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-v4.0.0-rc.1.zip SHA256SUMS-v4-rc1.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers v4.0.0-rc.1' \
            --prerelease --latest=false \
            --notes-file docs/V4_RC1_CHECKLIST.md
