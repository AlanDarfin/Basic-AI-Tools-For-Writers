name: Publish Basic AI v4.0.0 stable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v4-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources, bundle and full regression suite
        run: npm run check
      - name: Verify stable metadata and essential capabilities
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const manifest=require('./manifest.json');
          const pkg=require('./package.json');
          const versions=require('./versions.json');
          if(manifest.id!=='basic-ai-tool-for-writers')throw Error('Unexpected plugin ID');
          if(manifest.version!=='4.0.0'||pkg.version!==manifest.version)throw Error('Stable metadata mismatch');
          if(versions['4.0.0']!==manifest.minAppVersion)throw Error('Unsupported minAppVersion');
          if(manifest.isDesktopOnly!==false)throw Error('Mobile support disabled');
          for(const path of ['main.js','styles.css','docs/V4_RELEASE.md','LICENSE.md','THIRD_PARTY_NOTICES.md']){
            if(!fs.existsSync(path)||!fs.statSync(path).size)throw Error('Missing release file: '+path);
          }
          const code=fs.readFileSync('main.js','utf8');
          for(const ref of [
            'writerMergeModules(this.settings)',
            'writerRenderModuleSettings(this.plugin,panel',
            'writerRenderDiagnostics(this.plugin,panel',
            'writerModuleOn(',
            'writerAutoGrammarWindow',
            'writer-project-scene-depth-mark',
            'v4-format-',
            'writerV4OpenDiff'
          ])if(!code.includes(ref))throw Error('Missing stable feature: '+ref);
          NODE
      - name: Package stable plugin and SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-v4.0.0.zip main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-v4.0.0.zip > SHA256SUMS-v4.0.0.txt
          unzip -t Basic-AI-Tool-for-Writers-v4.0.0.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-v4.0.0.zip | wc -l)" -eq 3
      - name: Publish GitHub stable release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.0.0 >/dev/null 2>&1; then
            echo 'v4.0.0 already exists; refusing to overwrite a published release.'
            exit 1
          fi
          gh release create v4.0.0 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-v4.0.0.zip SHA256SUMS-v4.0.0.txt \
            THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers v4.0.0' \
            --latest \
            --notes-file docs/V4_RELEASE.md
