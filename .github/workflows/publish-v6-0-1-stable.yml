name: Publish Basic AI Tool for Writers 6.0.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v6-0-1-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full regression suite and verify bundle
        run: npm run check
      - name: Check community CSS
        run: node --test tests/css-community-lint.test.cjs
      - name: Verify release metadata and documentation
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='6.0.1'||p.version!==m.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Invalid stable 6.0.1 metadata');
          for(const name of ['README.md','docs/README.pt-BR.md','docs/V6_0_1_RELEASE.en.md','docs/V6_0_1_RELEASE.pt-BR.md'])
            if(!fs.readFileSync(name,'utf8').includes(m.version))throw Error('Missing translation or release notes: '+name);
          NODE
      - name: Create signed-off assets
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-6.0.1.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-6.0.1.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-6.0.1.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-6.0.1.zip > SHA256SUMS-6.0.1.txt
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 6.0.1 >/dev/null 2>&1; then
            echo "Already published; not overwriting."
            exit 0
          fi
          gh release create 6.0.1             main.js manifest.json styles.css             Basic-AI-Tool-for-Writers-6.0.1.zip SHA256SUMS-6.0.1.txt             --target "$GITHUB_SHA"             --title 'Basic AI Tool for Writers 6.0.1'             --latest             --notes-file docs/V6_0_1_RELEASE.en.md
