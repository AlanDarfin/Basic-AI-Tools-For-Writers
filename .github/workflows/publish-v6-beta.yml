name: Publish Basic AI 6.0.0 beta.1
on:
  push:
    branches: [feature/v6-full-integration]
    paths:
      - '.github/workflows/publish-v6-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression and bundle verification
        run: npm run check
      - name: Obsidian community CSS audit
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate beta metadata and required tool families
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.id!=='basic-ai-tool-for-writers'||m.version!=='6.0.0-beta.1'||p.version!==m.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Invalid v6 beta manifest/version mapping');
          const main=fs.readFileSync('main.js','utf8');
          for(const signature of ['class WriterV6Reading','class WriterV6Markup','class WriterV6Linter','writerV6ProtectedRanges','writerV6TimestampTokens','writerV6RatingTokens','writerV6RubyTokens'])if(!main.includes(signature))throw Error('Missing integrated v6 code: '+signature);
          for(const file of ['main.js','manifest.json','styles.css','docs/V6_BETA_RELEASE.md','docs/V6-IMPLEMENTATION.pt-BR.md','docs/V6-IMPLEMENTATION.en.md'])if(!fs.statSync(file).size)throw Error('Missing or empty file: '+file);
          NODE
      - name: Produce ZIP and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-6.0.0-beta.1.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-6.0.0-beta.1.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-6.0.0-beta.1.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-6.0.0-beta.1.zip > SHA256SUMS-6.0.0-beta.1.txt
      - name: Publish prerelease (never latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='6.0.0-beta.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Beta release already exists; not overwriting.'
            exit 0
          fi
          gh release create "$TAG" \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-6.0.0-beta.1.zip SHA256SUMS-6.0.0-beta.1.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 6.0.0-beta.1' \
            --prerelease \
            --notes-file docs/V6_BETA_RELEASE.md
