name: Publish Basic AI 6.0.0 beta.3
on:
  push:
    branches: [feature/v6-beta3-longform-ruby-ui]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full plugin bundle and tests
        run: npm run check
      - name: Obsidian CSS community compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate version and sources
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='6.0.0-beta.3'||m.version!==p.version||v[m.version]!==m.minAppVersion)throw Error('Invalid beta version');
          for(const part of ['writerBookNavFindProjectAsync','WriterV6RubyWidget','v6-wrap-ruby-below'])if(!fs.readFileSync('main.js','utf8').includes(part))throw Error('Module missing: '+part);
          NODE
      - name: Create release ZIP and hashes
        run: |
          zip -j Basic-AI-Tool-for-Writers-6.0.0-beta.3.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-6.0.0-beta.3.zip
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-6.0.0-beta.3.zip > SHA256SUMS-6.0.0-beta.3.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 6.0.0-beta.3 >/dev/null 2>&1; then exit 0; fi
          gh release create 6.0.0-beta.3 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-6.0.0-beta.3.zip SHA256SUMS-6.0.0-beta.3.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 6.0.0-beta.3' \
            --prerelease \
            --notes-file docs/V6_BETA3.en.md
