name: Publish Basic AI 6.0.0 beta.4
on:
  push:
    branches: [feature/v6-beta4-navigation-writing-workspace]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, bundle and regressions
        run: npm run check
      - name: Obsidian CSS community compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Verify version, locale and feature integration
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='6.0.0-beta.4'||m.version!==p.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Invalid beta metadata');
          for(const text of ['WriterV6SmartInsert','writerBookNavParseManual','writerBookNavAutoAllowed','writerV6ProjectPreferencesRender','writerV6ProjectReviewText']){
            if(!fs.readFileSync('main.js','utf8').includes(text))throw Error('Missing module: '+text);
          }
          for(const file of ['docs/V6_BETA4.en.md','docs/V6_BETA4.pt-BR.md','README.md','docs/README.pt-BR.md'])
            if(!fs.readFileSync(file,'utf8').includes(m.version))throw Error('Missing localized beta documentation: '+file);
          NODE
      - name: Make ZIP and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-6.0.0-beta.4.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-6.0.0-beta.4.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-6.0.0-beta.4.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-6.0.0-beta.4.zip > SHA256SUMS-6.0.0-beta.4.txt
      - name: Publish prerelease, not stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 6.0.0-beta.4 >/dev/null 2>&1; then exit 0; fi
          gh release create 6.0.0-beta.4 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-6.0.0-beta.4.zip SHA256SUMS-6.0.0-beta.4.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 6.0.0-beta.4' \
            --prerelease \
            --notes-file docs/V6_BETA4.en.md
