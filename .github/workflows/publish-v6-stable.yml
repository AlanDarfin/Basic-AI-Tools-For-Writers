name: Publish Basic AI Tool for Writers 6.0.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v6-stable.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete release candidate
        run: npm run check
      - name: Validate community CSS compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate bilingual release metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='6.0.0'||p.version!==m.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Stable metadata mismatch');
          for(const file of ['README.md','docs/README.pt-BR.md','docs/V6_RELEASE.en.md','docs/V6_RELEASE.pt-BR.md'])
            if(!fs.readFileSync(file,'utf8').includes(m.version))throw Error('Missing release documentation: '+file);
          NODE
      - name: Create ZIP and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-6.0.0.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-6.0.0.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-6.0.0.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-6.0.0.zip > SHA256SUMS-6.0.0.txt
      - name: Publish stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 6.0.0 >/dev/null 2>&1; then
            echo 'Stable release exists; not overwriting.'
            exit 0
          fi
          gh release create 6.0.0 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-6.0.0.zip SHA256SUMS-6.0.0.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 6.0.0' \
            --latest \
            --notes-file docs/V6_RELEASE.en.md
