name: Publish Basic AI Tool for Writers 7.0.0 beta.1
on:
  push:
    branches: [feature/v7-beta1-compendium-timeline]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source bundle, syntax and all regressions
        run: npm run check
      - name: Verify community CSS compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate beta, bilingual docs and reference separation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='7.0.0-beta.1'||m.version!==p.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Beta metadata out of sync');
          for(const file of ['README.md','docs/README.pt-BR.md','docs/V7_BETA1.en.md','docs/V7_BETA1.pt-BR.md'])
            if(!fs.readFileSync(file,'utf8').includes('7.0.0-beta.1'))throw Error('Missing localized beta documentation: '+file);
          for(const part of ['writerV7RenderCompendium','writerV7RenderTimeline','WriterV7Worldbuilding','writerV7NarrativeContext'])
            if(!fs.readFileSync('main.js','utf8').includes(part))throw Error('Missing v7 feature: '+part);
          NODE
      - name: Pack the three-file Obsidian plugin
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-7.0.0-beta.1.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-7.0.0-beta.1.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-7.0.0-beta.1.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-7.0.0-beta.1.zip > SHA256SUMS-7.0.0-beta.1.txt
      - name: Publish prerelease only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 7.0.0-beta.1 >/dev/null 2>&1; then
            echo 'This beta is already published; leaving it unchanged.'
            exit 0
          fi
          gh release create 7.0.0-beta.1 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-7.0.0-beta.1.zip SHA256SUMS-7.0.0-beta.1.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 7.0.0-beta.1' \
            --prerelease \
            --notes-file docs/V7_BETA1.en.md
