name: Publish Basic AI Tool for Writers 7.0.0 beta.2
on:
  push:
    branches: [feature/v7-beta2-story-worldbuilding]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, source bundle and all regressions
        run: npm run check
      - name: Obsidian CSS compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate beta metadata, translations and integrations
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='7.0.0-beta.2'||m.version!==p.version||v[m.version]!==m.minAppVersion||m.isDesktopOnly!==false)throw Error('Invalid beta metadata');
          for(const file of ['README.md','docs/README.pt-BR.md','docs/V7_BETA2.en.md','docs/V7_BETA2.pt-BR.md'])
            if(!fs.readFileSync(file,'utf8').includes(m.version))throw Error('Missing translation: '+file);
          for(const code of ['writerV7StudioRenderBoard','writerV7StudioRenderGraph','writerV7StudioRenderMaps',
            'writerV7StudioRenderGallery','writerV7StudioRenderSessions','writerV7StudioRenderTimeline'])
            if(!fs.readFileSync('main.js','utf8').includes(code))throw Error('Integration missing: '+code);
          NODE
      - name: Build Obsidian ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-7.0.0-beta.2.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-7.0.0-beta.2.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-7.0.0-beta.2.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-7.0.0-beta.2.zip > SHA256SUMS-7.0.0-beta.2.txt
      - name: Publish beta, never mark as stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 7.0.0-beta.2 >/dev/null 2>&1; then
            echo 'This beta already exists; not overwriting it.'
            exit 0
          fi
          gh release create 7.0.0-beta.2 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-7.0.0-beta.2.zip SHA256SUMS-7.0.0-beta.2.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 7.0.0-beta.2' \
            --prerelease \
            --notes-file docs/V7_BETA2.en.md
