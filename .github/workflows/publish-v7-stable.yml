name: Validate and publish Basic AI 7.0.0 stable
on:
  push:
    branches: [release/v7-stable, main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full syntax, bundle synchronization and regression suite
        run: npm run check
      - name: Community CSS compatibility
        run: node --test tests/css-community-lint.test.cjs
      - name: Validate stable manifest, documentation and mobile declaration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');
          if(m.version!=='7.0.0'||p.version!==m.version||v[m.version]!==m.minAppVersion)throw Error('Stable metadata mismatch');
          if(!/^[a-z-]+$/.test(m.id)||m.id.includes('obsidian')||m.id.endsWith('plugin'))throw Error('Invalid plugin ID');
          if(/obsidian|plugin/i.test(m.name)||!/^[a-zA-Z0-9()+ -]+$/.test(m.name))throw Error('Plugin name violates directory rules');
          if(typeof m.description!=='string'||m.description.length>250||!m.description.endsWith('.'))throw Error('Invalid description');
          if(m.isDesktopOnly!==false)throw Error('Mobile declaration changed unexpectedly');
          if(!/^\d+\.\d+\.\d+$/.test(m.version))throw Error('Version not strict semver');
          const docs=['README.md','docs/README.pt-BR.md','docs/V7_RELEASE.en.md','docs/V7_RELEASE.pt-BR.md'];
          for(const file of docs)if(!fs.readFileSync(file,'utf8').includes(m.version))throw Error('Missing bilingual docs: '+file);
          const en=fs.readFileSync('README.md','utf8'),pt=fs.readFileSync('docs/README.pt-BR.md','utf8');
          if(!en.includes('Latest stable:** [7.0.0]')||!pt.includes('Versão atual:** 7.0.0'))throw Error('README stable version mismatch');
          const bundle=fs.readFileSync('main.js','utf8');
          for(const symbol of ['WriterV7StableFeatures','writerV7CalendarSortDate','writerV7SeriesOpen','writerV7StableDependencies','writerV7RCRenderBoard'])
            if(!bundle.includes(symbol))throw Error('Missing v7 stable feature: '+symbol);
          NODE
      - name: Package the canonical three-file installation
        shell: bash
        run: |
          set -euo pipefail
          zip -j Basic-AI-Tool-for-Writers-7.0.0.zip main.js manifest.json styles.css
          unzip -t Basic-AI-Tool-for-Writers-7.0.0.zip
          test "$(unzip -Z1 Basic-AI-Tool-for-Writers-7.0.0.zip | wc -l)" -eq 3
          sha256sum main.js manifest.json styles.css Basic-AI-Tool-for-Writers-7.0.0.zip > SHA256SUMS-7.0.0.txt
      - name: Publish official stable only from main
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 7.0.0 >/dev/null 2>&1; then
            echo 'Stable 7.0.0 already published; preserving immutable release assets.'
            exit 0
          fi
          gh release create 7.0.0 \
            main.js manifest.json styles.css \
            Basic-AI-Tool-for-Writers-7.0.0.zip SHA256SUMS-7.0.0.txt \
            --target "$GITHUB_SHA" \
            --title 'Basic AI Tool for Writers 7.0.0' \
            --latest \
            --notes-file docs/V7_RELEASE.en.md
