name: Build and verify 9.5 candidate assets
on:
  push:
    branches: [feat/9.5.0-timeline-properties]
permissions:
  contents: write
concurrency:
  group: build-9-5-candidate
  cancel-in-progress: false
jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shipped assets from source modules
        run: npm run build
      - name: Syntax, bundle synchronization and entire regression suite
        run: npm run check
      - name: Community stylesheet checks
        run: node --test tests/css-community-lint.test.cjs
      - name: Commit only generated Obsidian files on working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js styles.css
          if git diff --cached --quiet; then
            echo "Bundled files were already synchronized"
          else
            git commit -m "build: synchronize 9.5.0 plugin assets [bundle-sync]"
            git push origin HEAD:feat/9.5.0-timeline-properties
          fi
