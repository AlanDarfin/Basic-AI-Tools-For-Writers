name: Publish beta release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-beta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript
        run: node --check main.js
      - name: Run unit tests
        run: node --test tests/*.test.cjs
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          zip -9 ../alans-offline-dictionary-2.0.0-beta.1.zip main.js manifest.json styles.css
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.0.0-beta.1 \
            --title "Alan's Offline Dictionary 2.0.0 Beta 1" \
            --notes "Experimental offline-first dictionary update: indexed search, improved parser, optional online lookup and local import, selected-text command, and UI improvements. Back up your vault before testing. Web Viewer integration and full TypeScript refactor are not included in this beta." \
            --prerelease \
            dist/main.js dist/manifest.json dist/styles.css alans-offline-dictionary-2.0.0-beta.1.zip
